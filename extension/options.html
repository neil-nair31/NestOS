<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>NestOS Helper — Options</title>
<style>
body{font:14px/1.45 "Segoe UI",system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;color:#1c2430}
label{display:block;font-size:12px;font-weight:600;color:#5c6b7a;margin:12px 0 4px}
input{width:100%;height:36px;border:1px solid #d8dee6;border-radius:6px;padding:0 10px;box-sizing:border-box}
button{margin-top:14px;height:36px;padding:0 16px;border:0;border-radius:6px;background:#0f4c81;color:#fff;font-weight:600;cursor:pointer}
#status{margin-top:12px;font-size:13px;color:#1f6b54}
</style>
</head>
<body>
  <h1>NestOS Naukri Helper</h1>
  <p>Default NestOS server URL used by the extension.</p>
  <label>NestOS base URL</label>
  <input id="url" placeholder="http://localhost:4100"/>
  <button id="save">Save</button>
  <div id="status"></div>
<script>
chrome.storage.sync.get({ nestosUrl: "http://localhost:4100" }, (cfg) => {
  document.getElementById("url").value = cfg.nestosUrl;
});
document.getElementById("save").onclick = () => {
  const nestosUrl = document.getElementById("url").value.trim().replace(/\/$/, "");
  chrome.storage.sync.set({ nestosUrl }, () => {
    document.getElementById("status").textContent = "Saved.";
  });
};
</script>
</body>
</html>

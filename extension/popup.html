<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NestOS Naukri Helper</title>
<style>
  body{width:320px;margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:#1c2430;background:#fff}
  .hd{background:#0f4c81;color:#fff;padding:12px 14px}
  .hd b{display:block;font-size:14px}
  .hd span{opacity:.85;font-size:11.5px}
  .bd{padding:14px}
  label{display:block;font-size:11px;font-weight:600;color:#5c6b7a;margin:0 0 4px}
  input{width:100%;height:34px;border:1px solid #d8dee6;border-radius:6px;padding:0 10px;margin-bottom:10px;box-sizing:border-box;font:inherit}
  button{width:100%;height:36px;border:0;border-radius:6px;background:#0f4c81;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.secondary{background:#fff;color:#0f4c81;border:1px solid #0f4c81;margin-top:8px}
  .msg{font-size:12px;margin-top:10px;padding:8px;background:#f3f6f9;border-radius:6px;display:none}
  .msg.on{display:block}
  .msg.err{background:#f8e8e8;color:#9b1c1c}
  .msg.ok{background:#e7f4ee;color:#1f6b54}
  .links{margin-top:12px;font-size:12px}
  .links a{color:#0f4c81;display:block;margin-top:4px}
</style>
</head>
<body>
  <div class="hd"><b>NestOS Naukri Helper</b><span>Sign in, then capture from Resdex</span></div>
  <div class="bd">
    <div id="signedOut">
      <label>NestOS URL</label>
      <input id="url" value="http://localhost:4100"/>
      <label>Email</label>
      <input id="email" value="recruiter@hummingbrains.com"/>
      <label>Password</label>
      <input id="password" type="password" value="Recruiter@123"/>
      <button id="login">Sign in to NestOS</button>
    </div>
    <div id="signedIn" style="display:none">
      <div id="who" style="font-size:12.5px;margin-bottom:10px"></div>
      <button id="demo">Open Resdex test page</button>
      <button class="secondary" id="naukri">Open Naukri recruiter login</button>
      <button class="secondary" id="app">Open NestOS dashboard</button>
      <button class="secondary" id="logout">Sign out</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="links">
      <a href="http://localhost:4100/extension-guide" target="_blank">Install / usage guide</a>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
